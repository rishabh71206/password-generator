<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#7c3aed" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<title>SecurePass — Password Generator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a14;
    --card: rgba(255,255,255,0.05);
    --accent1: #7c3aed;
    --accent2: #06b6d4;
    --accent3: #f472b6;
  }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Animated gradient blobs background */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .45;
    animation: float 12s ease-in-out infinite;
  }
  .blob1 { width: 450px; height: 450px; background: var(--accent1); top: -10%; left: -5%; }
  .blob2 { width: 400px; height: 400px; background: var(--accent2); bottom: -10%; right: -5%; animation-delay: -4s; }
  .blob3 { width: 300px; height: 300px; background: var(--accent3); top: 50%; left: 55%; animation-delay: -8s; }
  @keyframes float {
    0%,100% { transform: translate(0,0) scale(1); }
    33% { transform: translate(40px,-50px) scale(1.15); }
    66% { transform: translate(-30px,30px) scale(.9); }
  }

  /* Grid overlay */
  .grid-bg {
    position: fixed; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
  }

  .card {
    position: relative;
    z-index: 1;
    width: 480px;
    max-width: 92vw;
    padding: 40px;
    background: var(--card);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 24px;
    backdrop-filter: blur(20px);
    box-shadow: 0 25px 60px rgba(0,0,0,.5);
    animation: rise .8s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(40px) scale(.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  h1 {
    font-size: 2rem;
    text-align: center;
    background: linear-gradient(90deg, var(--accent2), var(--accent1), var(--accent3));
    background-size: 200%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 4s linear infinite;
    margin-bottom: 6px;
  }
  @keyframes shine { to { background-position: 200%; } }
  .subtitle { text-align: center; color: rgba(255,255,255,.5); font-size: .85rem; margin-bottom: 30px; }

  /* Password display */
  .password-box {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(0,0,0,.4);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 24px;
    min-height: 58px;
  }
  #password {
    flex: 1;
    font-family: 'Consolas', monospace;
    font-size: 1.05rem;
    letter-spacing: 1px;
    word-break: break-all;
    transition: color .3s;
  }
  .icon-btn {
    background: rgba(255,255,255,.08);
    border: none;
    color: #fff;
    width: 38px; height: 38px;
    border-radius: 10px;
    cursor: pointer;
    display: grid; place-items: center;
    transition: all .25s;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--accent1); transform: rotate(15deg) scale(1.1); }
  .icon-btn:active { transform: scale(.9); }
  .icon-btn.pop { animation: pop .4s ease; }
  @keyframes pop { 50% { transform: scale(1.35); } }

  /* Strength meter */
  .strength-label { font-size: .75rem; color: rgba(255,255,255,.5); margin-bottom: 6px; display: flex; justify-content: space-between; }
  .strength-bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.1); margin-bottom: 24px; overflow: hidden; }
  .strength-fill {
    height: 100%; width: 0%;
    border-radius: 3px;
    transition: width .5s cubic-bezier(.2,.8,.2,1), background .4s;
  }

  /* Controls */
  .row { margin-bottom: 20px; }
  .row-head { display: flex; justify-content: space-between; font-size: .85rem; color: rgba(255,255,255,.7); margin-bottom: 10px; }
  .row-head span:last-child { color: #fff; font-weight: 700; }

  input[type=range] {
    -webkit-appearance: none; width: 100%; height: 6px; border-radius: 3px;
    background: linear-gradient(90deg, var(--accent1), var(--accent2));
    outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 15px var(--accent2); cursor: grab;
    transition: transform .15s;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.25); }

  .toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .toggle {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 12px; padding: 12px 14px;
    cursor: pointer; font-size: .85rem;
    transition: all .25s; user-select: none;
  }
  .toggle:hover { background: rgba(255,255,255,.1); transform: translateY(-2px); }
  .toggle input { display: none; }
  .check {
    width: 18px; height: 18px; border-radius: 6px;
    border: 2px solid rgba(255,255,255,.3);
    display: grid; place-items: center;
    transition: all .25s; flex-shrink: 0;
  }
  .toggle input:checked ~ .check {
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    border-color: transparent;
  }
  .toggle input:checked ~ .check::after {
    content: '✓'; font-size: 11px; color: #fff;
  }
  .toggle.active { border-color: var(--accent2); box-shadow: 0 0 15px rgba(6,182,212,.25); }

  .generate-btn {
    width: 100%; padding: 16px;
    border: none; border-radius: 14px;
    font-size: 1rem; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    background-size: 200%;
    cursor: pointer;
    transition: all .3s;
    animation: btnshine 3s linear infinite;
    margin-top: 8px;
  }
  .generate-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(124,58,237,.4); background-position: 100%; }
  .generate-btn:active { transform: translateY(0) scale(.97); }
  .generate-btn.shake { animation: shake .4s, btnshine 3s linear infinite; }
  @keyframes btnshine { to { background-position: 200%; } }
  @keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }

  /* Database section */
  .db-section { margin-top: 26px; border-top: 1px solid rgba(255,255,255,.1); padding-top: 20px; }
  .db-head { display: flex; justify-content: space-between; align-items: center; font-size: .85rem; color: rgba(255,255,255,.7); margin-bottom: 12px; }
  .icon-btn.small { width: 30px; height: 30px; font-size: .85rem; }
  #labelInput {
    width: 100%; padding: 11px 14px; margin-bottom: 10px;
    background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px; color: #fff; font-size: .85rem; outline: none;
    transition: border .25s;
  }
  #labelInput:focus { border-color: var(--accent2); }
  #labelInput::placeholder { color: rgba(255,255,255,.35); }
  .save-btn {
    width: 100%; padding: 11px; margin-bottom: 14px;
    border: 1px solid rgba(6,182,212,.4); border-radius: 10px;
    background: rgba(6,182,212,.1); color: var(--accent2);
    font-size: .85rem; font-weight: 600; cursor: pointer;
    transition: all .25s;
  }
  .save-btn:hover { background: rgba(6,182,212,.25); transform: translateY(-2px); }
  .save-btn:active { transform: scale(.97); }
  .db-list { max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .db-item {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08);
    border-radius: 10px; padding: 9px 12px; font-size: .8rem;
    animation: rise .3s ease both;
  }
  .db-item .d-label { color: var(--accent2); font-weight: 600; min-width: 70px; }
  .db-item .d-pwd { flex: 1; font-family: Consolas, monospace; color: rgba(255,255,255,.8); word-break: break-all; }
  .db-item .d-date { color: rgba(255,255,255,.35); font-size: .7rem; white-space: nowrap; }
  .db-item button { background: none; border: none; cursor: pointer; font-size: .9rem; padding: 2px 5px; transition: transform .15s; }
  .db-item button:hover { transform: scale(1.25); }
  .db-empty { text-align: center; color: rgba(255,255,255,.3); font-size: .8rem; padding: 14px 0; }
  .db-list::-webkit-scrollbar { width: 5px; }
  .db-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 3px; }

  /* Floating symbols decoration */
  .float-char {
    position: fixed; font-family: monospace; font-size: 1.2rem;
    color: rgba(255,255,255,.15); z-index: 0; pointer-events: none;
    animation: drift linear infinite;
  }
  @keyframes drift {
    from { transform: translateY(110vh) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    to { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
  }

  @media (max-width: 520px) { .card { padding: 26px; } .toggles { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <div class="grid-bg"></div>

  <div class="card">
    <h1>🔐 SecurePass</h1>
    <p class="subtitle">Unhackable passwords, generated instantly</p>

    <div class="password-box">
      <span id="password">Click Generate...</span>
      <button class="icon-btn" id="copyBtn" title="Copy">📋</button>
      <button class="icon-btn" id="regenBtn" title="Regenerate">🔄</button>
    </div>

    <div class="strength-label"><span>Strength</span><span id="strengthText">—</span></div>
    <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>

    <div class="row">
      <div class="row-head"><span>Password Length</span><span id="lenVal">16</span></div>
      <input type="range" id="length" min="4" max="64" value="16" />
    </div>

    <div class="toggles">
      <label class="toggle active"><input type="checkbox" id="upper" checked /><span class="check"></span>Uppercase</label>
      <label class="toggle active"><input type="checkbox" id="lower" checked /><span class="check"></span>Lowercase</label>
      <label class="toggle active"><input type="checkbox" id="numbers" checked /><span class="check"></span>Numbers</label>
      <label class="toggle active"><input type="checkbox" id="symbols" checked /><span class="check"></span>Symbols</label>
    </div>

    <button class="generate-btn" id="genBtn">✨ Generate Password</button>

    <div class="db-section">
      <div class="db-head">
        <span>🗄️ Saved Passwords</span>
        <button class="icon-btn small" id="clearDb" title="Clear all">🗑️</button>
      </div>
      <input type="text" id="labelInput" placeholder="Label (e.g. Gmail, WiFi...)" />
      <button class="save-btn" id="saveBtn">💾 Save Password</button>
      <div id="dbList" class="db-list"></div>
    </div>
  </div>

<script>
  const passwordEl = document.getElementById('password');
  const lengthEl = document.getElementById('length');
  const lenVal = document.getElementById('lenVal');
  const genBtn = document.getElementById('genBtn');
  const copyBtn = document.getElementById('copyBtn');
  const regenBtn = document.getElementById('regenBtn');
  const strengthFill = document.getElementById('strengthFill');
  const strengthText = document.getElementById('strengthText');

  const sets = {
    upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    lower: 'abcdefghijklmnopqrstuvwxyz',
    numbers: '0123456789',
    symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?/~`'
  };
  const opts = ['upper','lower','numbers','symbols'];

  // floating background characters
  const chars = '!@#$%^&*()_+-=[]{}<>?';
  for (let i = 0; i < 25; i++) {
    const s = document.createElement('span');
    s.className = 'float-char';
    s.textContent = chars[Math.floor(Math.random()*chars.length)];
    s.style.left = Math.random()*100 + 'vw';
    s.style.animationDuration = (10 + Math.random()*15) + 's';
    s.style.animationDelay = (-Math.random()*20) + 's';
    s.style.fontSize = (0.8 + Math.random()*1.2) + 'rem';
    document.body.appendChild(s);
  }

  function getCharset() {
    return opts.filter(o => document.getElementById(o).checked).map(o => sets[o]).join('');
  }

  function strength() {
    const len = +lengthEl.value;
    const pools = opts.filter(o => document.getElementById(o).checked).length;
    let score = 0;
    if (pools >= 3) score += 2; else if (pools === 2) score += 1;
    if (len >= 12) score += 2; else if (len >= 8) score += 1;
    if (pools === 4 && len >= 16) score += 2; else if (len >= 20) score += 1;
    const levels = [
      { label: 'Weak', color: '#ef4444', pct: 25 },
      { label: 'Fair', color: '#f59e0b', pct: 50 },
      { label: 'Strong', color: '#22c55e', pct: 75 },
      { label: 'Unhackable', color: 'linear-gradient(90deg,#7c3aed,#06b6d4)', pct: 100 }
    ];
    const lvl = levels[Math.min(score, 3)];
    strengthFill.style.width = lvl.pct + '%';
    strengthFill.style.background = lvl.color;
    strengthText.textContent = lvl.label;
    strengthText.style.color = typeof lvl.color === 'string' && lvl.color.startsWith('#') ? lvl.color : '#22c55e';
  }

  function scrambleAndReveal(final) {
    const chars = '!@#$%^&*()_+-=[]{}<>?ABCDEFabcdef0123456789';
    let frame = 0;
    const total = 25;
    const timer = setInterval(() => {
      frame++;
      const done = Math.floor(frame / total * final.length);
      let out = final.slice(0, done);
      for (let i = done; i < final.length; i++) out += chars[Math.floor(Math.random()*chars.length)];
      passwordEl.textContent = out;
      if (frame >= total) { clearInterval(timer); passwordEl.textContent = final; }
    }, 30);
  }

  function generate() {
    const charset = getCharset();
    if (!charset) {
      genBtn.classList.remove('shake'); void genBtn.offsetWidth; genBtn.classList.add('shake');
      return;
    }
    const len = +lengthEl.value;
    const arr = new Uint32Array(len);
    crypto.getRandomValues(arr);
    const pwd = Array.from(arr, n => charset[n % charset.length]).join('');
    scrambleAndReveal(pwd);
    strength();
  }

  lengthEl.addEventListener('input', () => {
    lenVal.textContent = lengthEl.value;
    strength();
  });
  opts.forEach(o => document.getElementById(o).addEventListener('change', e => {
    e.target.closest('.toggle').classList.toggle('active', e.target.checked);
    strength();
  }));

  // ---------- Local database (localStorage) ----------
  const DB_KEY = 'securepass_db';
  const labelInput = document.getElementById('labelInput');
  const saveBtn = document.getElementById('saveBtn');
  const clearDb = document.getElementById('clearDb');
  const dbList = document.getElementById('dbList');

  function loadDb() {
    try { return JSON.parse(localStorage.getItem(DB_KEY)) || []; }
    catch { return []; }
  }
  function persistDb(data) { localStorage.setItem(DB_KEY, JSON.stringify(data)); }

  function esc(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderDb() {
    const data = loadDb();
    if (!data.length) {
      dbList.innerHTML = '<div class="db-empty">No saved passwords yet</div>';
      return;
    }
    dbList.innerHTML = data.slice().reverse().map((item, idx) => {
      const realIdx = data.length - 1 - idx;
      return `<div class="db-item">
        <span class="d-label">${esc(item.label)}</span>
        <span class="d-pwd">${esc(item.password)}</span>
        <span class="d-date">${item.date}</span>
        <button data-act="copy" data-i="${realIdx}" title="Copy">📋</button>
        <button data-act="del" data-i="${realIdx}" title="Delete">✖️</button>
      </div>`;
    }).join('');
  }

  saveBtn.addEventListener('click', () => {
    const pwd = passwordEl.textContent;
    if (!pwd || pwd === 'Click Generate...') {
      saveBtn.textContent = 'Generate first!';
      setTimeout(() => saveBtn.textContent = '💾 Save Password', 1200);
      return;
    }
    const data = loadDb();
    data.push({
      label: labelInput.value.trim() || 'Password',
      password: pwd,
      date: new Date().toLocaleDateString()
    });
    persistDb(data);
    labelInput.value = '';
    saveBtn.textContent = '✅ Saved!';
    setTimeout(() => saveBtn.textContent = '💾 Save Password', 1200);
    renderDb();
  });

  dbList.addEventListener('click', e => {
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const data = loadDb();
    const item = data[+btn.dataset.i];
    if (btn.dataset.act === 'copy') {
      navigator.clipboard.writeText(item.password);
      btn.textContent = '✅';
      setTimeout(renderDb, 800);
    } else {
      data.splice(+btn.dataset.i, 1);
      persistDb(data);
      renderDb();
    }
  });

  clearDb.addEventListener('click', () => {
    if (confirm('Delete ALL saved passwords?')) {
      localStorage.removeItem(DB_KEY);
      renderDb();
    }
  });

  genBtn.addEventListener('click', generate);
  regenBtn.addEventListener('click', generate);
  copyBtn.addEventListener('click', () => {
    const pwd = passwordEl.textContent;
    if (!pwd || pwd === 'Click Generate...') return;
    navigator.clipboard.writeText(pwd);
    copyBtn.classList.remove('pop'); void copyBtn.offsetWidth; copyBtn.classList.add('pop');
    copyBtn.textContent = '✅';
    setTimeout(() => copyBtn.textContent = '📋', 1200);
  });

  generate();
  renderDb();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
